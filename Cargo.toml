[package]
name = "dirrcmp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Terminal UI for comparing two directories (Rust rewrite of ilyasturki/dircmp)"
license = "MIT"

[dependencies]
ratatui = "0.29"
# Optional: far more languages for syntax highlighting (pure Rust regex engine).
syntect = { version = "5", optional = true, default-features = false, features = [
	"default-fancy",
] }

[features]
default = []
syntect = ["dep:syntect"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
