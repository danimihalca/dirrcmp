[package]
name = "dircmp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Terminal UI for comparing two directories (Rust rewrite of ilyasturki/dircmp)"
license = "MIT"

[dependencies]
ratatui = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
